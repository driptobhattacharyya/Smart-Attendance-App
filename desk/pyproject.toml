[project]
name = "attendify-desk"
version = "1.0.0"
description = "Attendify Desk: turns an office computer into the Bluetooth beacon for Attendify attendance."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pystray>=0.19.5",
  "Pillow>=10.4",
  # Windows-only: official PyWinRT projections. Markers keep Linux installs (CI, tests) working.
  "winrt-runtime>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth.Advertisement>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.3; sys_platform == 'win32'",
  "winrt-Windows.Devices.Radios>=2.3; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[tool.uv]
# An application, not a library: no build backend, run from source.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
