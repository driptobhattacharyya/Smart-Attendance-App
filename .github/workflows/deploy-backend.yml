name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/aws/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# OIDC to AWS: no long-lived keys. See infra/aws/README.md for the role.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Test before deploying
        working-directory: backend
        run: |
          uv sync --all-groups --frozen
          uv run ruff check .
          uv run pytest -q

      # The function is arm64; QEMU lets the x86 runner build that image.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `sam build` builds backend/Dockerfile.lambda; `sam deploy` pushes the image to the
      # SAM-managed ECR repository (resolve_image_repos in samconfig.toml) and updates the stack.
      - name: Build image
        working-directory: infra/aws
        run: sam build

      # Migrations run before the new code goes live, as the table OWNER over a direct
      # (non-pooled) connection. They are additive and idempotent per revision.
      - name: Run database migrations
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          ATTENDIFY_APP_PASSWORD: ${{ secrets.ATTENDIFY_APP_PASSWORD }}
          ATTENDIFY_SYSTEM_PASSWORD: ${{ secrets.ATTENDIFY_SYSTEM_PASSWORD }}
        run: uv run alembic upgrade head

      - name: Deploy stack
        working-directory: infra/aws
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SYSTEM_URL: ${{ secrets.DATABASE_SYSTEM_URL }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "DatabaseUrl=${DATABASE_URL}" \
              "DatabaseSystemUrl=${DATABASE_SYSTEM_URL}" \
              "DataKey=${DATA_KEY}" \
              "InternalJobSecret=${INTERNAL_JOB_SECRET}" \
              "JwtSecret=${JWT_SECRET}" \
              "OriginSecret=${ORIGIN_SECRET}"

      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name attendify-api \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "Function URL: ${url}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 40 "${url%/}/api/v1/health"
